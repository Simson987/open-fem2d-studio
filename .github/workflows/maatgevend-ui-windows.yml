name: Maatgevend UI op Windows

on:
  pull_request:
    paths:
      - design-mockup/test-maatgevend-ui.mjs
      - design-mockup/scripts/maatgevend-browser.tsx
      - design-mockup/scripts/headlessBrowser.mjs
      - .github/workflows/maatgevend-ui-windows.yml
  workflow_dispatch:

jobs:
  edge:
    name: Maatgevend UI (Edge, Windows)
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
        working-directory: design-mockup
      - run: npx --yes tsx --version
        working-directory: design-mockup
      - name: Vijf keer naast CPU-belasting
        shell: pwsh
        working-directory: design-mockup
        run: |
          $edge = @(
            'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe',
            'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw 'Edge ontbreekt op de Windows-runner' }
          $env:OPENAEC_BROWSER = $edge
          $busy = Start-Job -ScriptBlock {
            while ($true) { [Math]::Sqrt(123456.0) > $null }
          }
          try {
            foreach ($i in 1..5) {
              Write-Host "Maatgevend UI poging $i"
              npx --yes tsx test-maatgevend-ui.mjs
              if ($LASTEXITCODE -ne 0) { throw "Poging $i faalde" }
            }
          } finally {
            Stop-Job $busy
            Remove-Job $busy
          }
