[package]
name = "natuursteen-check"
version = "2026.44.0"
license = "LGPL-3.0-or-later"
edition = "2021"
description = "Toetsing van natuurstenen elementen (buiging, druk, afschuiving, oplegging, doorbuiging, verankering) met karakteristieke sterkten uit beproeving (NEN-EN 1990 bijlage D) op het gedeelde NamedCheck-contract"

[lib]
